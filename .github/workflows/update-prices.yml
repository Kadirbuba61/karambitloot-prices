name: Update CS2 Prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices from ByMykel tracker
        run: python fetch-prices.py

      - name: Check if prices.json changed
        id: check
        run: |
          if git diff --quiet prices.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  prices.json değişmedi, commit atlanıyor."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ prices.json değişti, commit yapılacak."
            git diff --stat prices.json
          fi

      - name: Configure Git
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git add prices.json
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          ITEM_COUNT=$(python -c "import json; print(len(json.load(open('prices.json'))))")
          git commit -m "🔄 Prices updated — $ITEM_COUNT items — $TIMESTAMP"
          git pull --rebase origin main || true
          git push

      - name: Summary
        run: |
          if [ -f prices.json ]; then
            ITEM_COUNT=$(python -c "import json; print(len(json.load(open('prices.json'))))")
            echo "### ✅ Fiyat Güncelleme Özeti" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 Toplam fiyat: **$ITEM_COUNT**" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Değişiklik: **${{ steps.check.outputs.changed }}**" >> $GITHUB_STEP_SUMMARY
            echo "- 🕐 Zaman: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          fi
